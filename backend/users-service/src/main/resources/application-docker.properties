server.port=${PORT_USER:8081}
spring.application.name=users-service
spring.data.mongodb.uri=mongodb://localhost:27017/users-db
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
jwt.secret=${JWT_SECRET:someSuperSecretKeyOrSomethingAlsoDefaultNotVerySecureSomethingSomething}
spring.mail.host=streaming-mailhog
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
#spring.mail.properties.mail.debug=true