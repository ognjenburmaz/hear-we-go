server.port=${PORT_RECOMMENDATIONS:8086}
spring.application.name=recommendation-service

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# ==========================================
# HTTPS / SERVER SSL
# ==========================================
server.ssl.enabled=${SERVER_SSL_ENABLED}
server.ssl.key-store=${SERVER_SSL_KEY_STORE}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD}
server.ssl.key-store-type=${SERVER_SSL_KEY_STORE_TYPE}
server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS}

# ==========================================
# TRUST STORE (CLIENT SSL)
# ==========================================
server.ssl.trust-store=${SERVER_SSL_TRUST_STORE}
server.ssl.trust-store-password=${SERVER_SSL_TRUST_STORE_PASSWORD}
server.ssl.trust-store-type=${SERVER_SSL_TRUST_STORE_TYPE}

# ==========================================
# 3. EUREKA CONFIG (Register as Secure)
# ==========================================
eureka.instance.non-secure-port-enabled=false
eureka.instance.secure-port-enabled=true
eureka.instance.secure-port=${server.port}
eureka.instance.hostname=${spring.application.name}

# Explicitly tell Eureka Clients to talk to me via HTTPS
eureka.instance.home-page-url=https://${eureka.instance.hostname}:${server.port}/
eureka.instance.status-page-url=https://${eureka.instance.hostname}:${server.port}/actuator/info
eureka.instance.health-check-url=https://${eureka.instance.hostname}:${server.port}/actuator/health

# ==========================================
# REQ 2.7.1: Configure HTTP Client
# ==========================================
# Enable OkHttp (More robust, supports connection pooling)
spring.cloud.openfeign.okhttp.enabled=true

# ==========================================
# REQ 2.7.2: Timeouts (Per Request)
# ==========================================
# Connect Timeout: Time to establish handshake (2s)
spring.cloud.openfeign.client.config.default.connectTimeout=2000
# Read Timeout: Time to wait for data after connection (5s)
spring.cloud.openfeign.client.config.default.readTimeout=5000

# ==========================================
# REQ 2.7.4: Circuit Breaker Configuration
# ==========================================
# Enable Circuit Breaker for Feign
spring.cloud.openfeign.circuitbreaker.enabled=true

# Define the rules for "content-service"
resilience4j.circuitbreaker.instances.content-service.registerHealthIndicator=true
# 1. Failure Rate: If 50% of requests fail...
resilience4j.circuitbreaker.instances.content-service.failureRateThreshold=50
# 2. Window: ...out of the last 10 requests...
resilience4j.circuitbreaker.instances.content-service.slidingWindowSize=10
# 3. Action: Open the circuit (Stop requests) for 10 seconds
resilience4j.circuitbreaker.instances.content-service.waitDurationInOpenState=10000
# 4. Permitted: Allow 3 requests to pass in "Half-Open" state to check if it's fixed
resilience4j.circuitbreaker.instances.content-service.permittedNumberOfCallsInHalfOpenState=3

# ==========================================
# REQ 2.7.5: Retry Mechanism
# ==========================================
# Apply to "content-service" (matches FeignClient name)
resilience4j.retry.instances.content-service.max-attempts=3
resilience4j.retry.instances.content-service.wait-duration=1s
# Exponential backoff (wait 1s, then 2s, then 4s...) is pro, but simple is fine for school
resilience4j.retry.instances.content-service.enable-exponential-backoff=true
resilience4j.retry.instances.content-service.exponential-backoff-multiplier=2

# ==========================================
# REQ 2.7.7: Upstream gives up (TimeLimiter)
# ==========================================
# Enable TimeLimiter
resilience4j.timelimiter.instances.content-service.timeout-duration=2s
# Ensure the cancel-running-future is true so it actually stops the thread
resilience4j.timelimiter.instances.content-service.cancel-running-future=true

logging.level.io.github.resilience4j.retry=DEBUG

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Use ErrorHandlingDeserializer to be safe
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Map the event type
spring.kafka.consumer.properties.spring.json.type.mapping=songDeleted:com.streaming.common.event.SongDeletedEvent