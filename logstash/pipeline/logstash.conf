input {
  beats {
    port => 5044
  }
}

filter {
  # Optional: parse JSON logs if your containers output JSON
  json {
    source => "message"
    remove_field => ["message"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "docker-logs-%{+YYYY.MM.dd}"
  }
  stdout { codec => rubydebug }  # for debugging in Logstash logs
}
