services:
  # ==========================================
  # 1. INFRASTRUCTURE
  # ==========================================

  mongo:
    image: mongo:latest
    container_name: streaming-mongo
    ports:
      - "${PORT_MONGO}:27017"
    volumes:
      - mongo_data:/data/db
      - ./backend/users-service/src/main/resources/db:/docker-entrypoint-initdb.d
    networks:
      - streaming-net
    environment:
      MONGO_INITDB_DATABASE: users-db

  redis:
    image: redis:alpine
    container_name: streaming-redis
    ports:
      - "${PORT_REDIS}:6379"
    networks:
      - streaming-net

  scylla:
    image: scylladb/scylla
    container_name: streaming-scylla
    ports:
      - "${PORT_SCYLLA}:9042"
    command: --smp 1 --memory 750M
    networks:
      - streaming-net

  neo4j:
    image: neo4j:latest
    container_name: streaming-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=none
    networks:
      - streaming-net

  kafka:
    image: redpandadata/redpanda:latest
    container_name: streaming-kafka
    command:
      - redpanda start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:29092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:28082
    ports:
      - "${PORT_KAFKA}:29092"
    networks:
      - streaming-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: streaming-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "9411:9411"
    networks:
      - streaming-net

  # HDFS Namenode
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: streaming-namenode
    hostname: namenode
    environment:
      - CLUSTER_NAME=test
      - HDFS_CONF_dfs_permissions_enabled=false
    ports:
      - "${PORT_HADOOP}:9870"
      - "8020:8020"
    networks:
      - streaming-net

  # HDFS Datanode
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: streaming-datanode
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - HDFS_CONF_dfs_permissions_enabled=false
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
    depends_on:
      - namenode
    networks:
      - streaming-net

  # ==========================================
  # 2. MICROSERVICES
  # ==========================================

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "${PORT_GATEWAY}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_ENABLED=true
      - JAVA_TOOL_OPTIONS=-Xmx200m
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - streaming-net

  discovery-service:
    build:
      context: ./backend
      dockerfile: discovery-service/Dockerfile
    container_name: discovery-service
    ports:
      - "${PORT_EUREKA}:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # Limit Java Memory to 200MB to save RAM
      - JAVA_TOOL_OPTIONS=-Xmx200m
    networks:
      - streaming-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  users-service:
    build:
      context: ./backend
      dockerfile: users-service/Dockerfile
    container_name: users-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/users-db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - JAVA_TOOL_OPTIONS=-Xmx200m
      - JWT_SECRET=${JWT_SECRET}
      - EMAIL_PASSWORD=${EMAIL_PASSWORD}
    depends_on:
      - mongo
      - discovery-service
    networks:
      - streaming-net

  content-service:
    build:
      context: ./backend
      dockerfile: content-service/Dockerfile
    container_name: content-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/content-db
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - HDFS_URI=hdfs://namenode:8020
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JAVA_TOOL_OPTIONS=-Xmx200m
    depends_on:
      - mongo
      - redis
      - namenode
      - discovery-service
      - kafka
    networks:
      - streaming-net

  ratings-service:
    build:
      context: ./backend
      dockerfile: ratings-service/Dockerfile
    container_name: ratings-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CASSANDRA_CONTACT_POINTS=scylla
      - SPRING_CASSANDRA_PORT=9042
      - SPRING_CASSANDRA_LOCAL_DATACENTER=datacenter1
      - SPRING_CASSANDRA_KEYSPACE_NAME=ratings_ks
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JAVA_TOOL_OPTIONS=-Xmx200m
    depends_on:
      - scylla
      - discovery-service
      - kafka
    networks:
      - streaming-net

  subscriptions-service:
    build:
      context: ./backend
      dockerfile: subscriptions-service/Dockerfile
    container_name: subscriptions-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CASSANDRA_CONTACT_POINTS=scylla
      - SPRING_CASSANDRA_PORT=9042
      - SPRING_CASSANDRA_LOCAL_DATACENTER=datacenter1
      - SPRING_CASSANDRA_KEYSPACE_NAME=subscriptions_ks
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JAVA_TOOL_OPTIONS=-Xmx200m
    depends_on:
      - scylla
      - discovery-service
      - kafka
    networks:
      - streaming-net

  notification-service:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CASSANDRA_CONTACT_POINTS=scylla
      - SPRING_CASSANDRA_PORT=9042
      - SPRING_CASSANDRA_LOCAL_DATACENTER=datacenter1
      - SPRING_CASSANDRA_KEYSPACE_NAME=notifications_ks
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JAVA_TOOL_OPTIONS=-Xmx200m
    depends_on:
      - scylla
      - discovery-service
      - kafka
    networks:
      - streaming-net

  recommendation-service:
    build:
      context: ./backend
      dockerfile: recommendation-service/Dockerfile
    container_name: recommendation-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_NEO4J_URI=bolt://neo4j:7687
      - SPRING_NEO4J_AUTHENTICATION_USERNAME=neo4j
      - SPRING_NEO4J_AUTHENTICATION_PASSWORD=password
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JAVA_TOOL_OPTIONS=-Xmx200m
    depends_on:
      - neo4j
      - discovery-service
      - kafka
    networks:
      - streaming-net

  analytics-service:
    build:
      context: ./backend
      dockerfile: analytics-service/Dockerfile
    container_name: analytics-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/analytics-db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JAVA_TOOL_OPTIONS=-Xmx200m
    depends_on:
      - mongo
      - discovery-service
      - kafka
    networks:
      - streaming-net

  frontend-client:
    build:
      context: ./frontend/hear-we-go
      dockerfile: Dockerfile
    container_name: streaming-frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - streaming-net

volumes:
  mongo_data:

networks:
  streaming-net:
    driver: bridge