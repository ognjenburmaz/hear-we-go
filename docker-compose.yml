services:
  # ==========================================
  # 1. INFRASTRUCTURE
  # ==========================================

  mongo:
    image: mongo:latest
    container_name: streaming-mongo
    ports:
      - "${PORT_MONGO}:27017"
    volumes:
      - mongo_data:/data/db
      - ./backend/common-lib/src/main/resources/db:/docker-entrypoint-initdb.d
    networks:
      - streaming-net
    environment:
      MONGO_INITDB_DATABASE: users-db

  redis:
    image: redis:alpine
    container_name: streaming-redis
    ports:
      - "${PORT_REDIS}:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - streaming-net

  scylla:
    image: scylladb/scylla
    container_name: streaming-scylla
    ports:
      - "${PORT_SCYLLA}:9042"
    command: --smp 1 --memory 750M
    networks:
      - streaming-net
    healthcheck:
      test: [ "CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 10

  #  neo4j:
  #    image: neo4j:latest
  #    container_name: streaming-neo4j
  #    ports:
  #      - "7474:7474"
  #      - "7687:7687"
  #    environment:
  #      - NEO4J_AUTH=none
  #    networks:
  #      - streaming-net
  #
  #  kafka:
  #    image: redpandadata/redpanda:latest
  #    container_name: streaming-kafka
  #    command:
  #      - redpanda start
  #      - --smp 1
  #      - --memory 512M
  #      - --overprovisioned
  #      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:29092
  #      - --advertise-kafka-addr internal://kafka:9092,external://localhost:29092
  #      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:28082
  #    ports:
  #      - "${PORT_KAFKA}:29092"
  #    networks:
  #      - streaming-net

  # TODO ---------------------------------

  neo4j:
    image: neo4j:5
    container_name: streaming-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: none
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
    volumes:
      - neo4j_data:/data
      - ./neo4j/init:/var/lib/neo4j/import
    command: [ "/bin/bash", "/var/lib/neo4j/import/init.sh" ]
    networks:
      - streaming-net



  kafka:
    image: redpandadata/redpanda:latest
    container_name: streaming-kafka
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - "512M"
      - --overprovisioned
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:29092
      - --advertise-kafka-addr
      - internal://streaming-kafka:9092,external://localhost:29092
    ports:
      - "29092:29092"
    networks:
      - streaming-net

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: streaming-jaeger
    ports:
      - "16686:16686"
      - "4317:4317"
      - "9411:9411"
    networks:
      - streaming-net

  # HDFS Namenode
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: streaming-namenode
    hostname: namenode
    environment:
      - CLUSTER_NAME=test
      - HDFS_CONF_dfs_permissions_enabled=false
    ports:
      - "${PORT_HADOOP}:9870"
      - "8020:8020"
    networks:
      - streaming-net
    volumes:
      - namenode_data:/hadoop/dfs/name

  # HDFS Datanode
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: streaming-datanode
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - HDFS_CONF_dfs_permissions_enabled=false
      - CORE_CONF_fs_defaultFS=hdfs://namenode:8020
    depends_on:
      - namenode
    networks:
      - streaming-net
    volumes:
      - datanode_data:/hadoop/dfs/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: streaming-mailhog
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - streaming-net

  # ==========================================
  # 2. MICROSERVICES
  # ==========================================

  api-gateway:
    build:
      context: ./backend
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "${PORT_GATEWAY}:8080"
    volumes:
      - ./certs:/app/certs
    env_file:
      - .env
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - streaming-net

  discovery-service:
    build:
      context: ./backend
      dockerfile: discovery-service/Dockerfile
    container_name: discovery-service
    ports:
      - "${PORT_EUREKA}:8761"
    volumes:
      - ./certs:/app/certs
    env_file:
      - .env
    networks:
      - streaming-net
    healthcheck:
      test: [ "CMD", "curl", "-f", "-k", "https://localhost:8761/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  users-service:
    build:
      context: ./backend
      dockerfile: users-service/Dockerfile
    container_name: users-service
    volumes:
      - ./certs:/app/certs
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      #      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/users-db
      - SPRING_DATA_MONGODB_URI=${SPRING_DATA_MONGODB_URI_USERS}
    depends_on:
      - mongo
      - discovery-service
    networks:
      - streaming-net

  content-service:
    build:
      context: ./backend
      dockerfile: content-service/Dockerfile
    container_name: content-service
    volumes:
      - ./certs:/app/certs
    env_file:
      - .env
    environment:
      - SPRING_DATA_MONGODB_URI=${SPRING_DATA_MONGODB_URI_CONTENT}
    depends_on:
      - mongo
      - redis
      - namenode
      - discovery-service
      - kafka
    networks:
      - streaming-net

  ratings-service:
    build:
      context: ./backend
      dockerfile: ratings-service/Dockerfile
    container_name: ratings-service
    volumes:
      - ./certs:/app/certs
    env_file:
      - .env
    depends_on:
      scylla:
        condition: service_healthy
      discovery-service:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - streaming-net

  subscriptions-service:
    build:
      context: ./backend
      dockerfile: subscriptions-service/Dockerfile
    container_name: subscriptions-service
    volumes:
      - ./certs:/app/certs
    env_file:
      - .env

    depends_on:
      scylla:
        condition: service_healthy
      discovery-service:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - streaming-net

  notification-service:
    build:
      context: ./backend
      dockerfile: notification-service/Dockerfile
    container_name: notification-service
    volumes:
      - ./certs:/app/certs
    restart: always
    env_file:
      - .env
    depends_on:
      discovery-service:
        condition: service_started
      kafka:
        condition: service_started
      scylla:
        condition: service_healthy
    networks:
      - streaming-net

  recommendation-service:
    build:
      context: ./backend
      dockerfile: recommendation-service/Dockerfile
    container_name: recommendation-service
    volumes:
      - ./certs:/app/certs
    env_file:
      - .env
    depends_on:
      - neo4j
      - discovery-service
      - kafka
    networks:
      - streaming-net

  analytics-service:
    build:
      context: ./backend
      dockerfile: analytics-service/Dockerfile
    container_name: analytics-service
    volumes:
      - ./certs:/app/certs
    env_file:
      - .env
    environment:
      - SPRING_DATA_MONGODB_URI=${SPRING_DATA_MONGODB_URI_ANALYTICS}
    depends_on:
      - mongo
      - discovery-service
      - kafka
    networks:
      - streaming-net

  frontend-client:
    build:
      context: ./frontend/hear-we-go
      dockerfile: Dockerfile
    container_name: streaming-frontend
    volumes:
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api-gateway
    networks:
      - streaming-net

volumes:
  mongo_data:
  namenode_data:
  datanode_data:
  neo4j_data:

networks:
  streaming-net:
    driver: bridge