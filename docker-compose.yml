services:
  # ==========================================
  # 1. INFRASTRUCTURE (Databases & Brokers)
  # ==========================================

  # MongoDB (Users, Content, Analytics)
  mongo:
    image: mongo:latest
    container_name: streaming-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - streaming-net

  # Redis (Caching for Content)
  redis:
    image: redis:alpine
    container_name: streaming-redis
    ports:
      - "6379:6379"
    networks:
      - streaming-net

  # ScyllaDB (Alternative to Cassandra - Faster/Lighter)
  # Used for: Ratings, Subscriptions, Notifications
  scylla:
    image: scylladb/scylla
    container_name: streaming-scylla
    ports:
      - "9042:9042" # CQL Port
    # Optimization to reduce memory usage for dev
    command: --smp 1 --memory 750M
    networks:
      - streaming-net

  # Neo4j (Recommendations)
  neo4j:
    image: neo4j:latest
    container_name: streaming-neo4j
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    environment:
      - NEO4J_AUTH=none # Disable password for dev simplicity
    networks:
      - streaming-net

  # Zookeeper (Required for Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: streaming-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - streaming-net

  # Kafka (Event Bus)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: streaming-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - streaming-net

  # Jaeger (Tracing - Req 2.10)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: streaming-jaeger
    ports:
      - "16686:16686" # UI
      - "4317:4317"   # OTLP GRPC
      - "9411:9411"   # Zipkin
    networks:
      - streaming-net

  # HDFS Namenode (Req 2.11)
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: streaming-namenode
    environment:
      - CLUSTER_NAME=test
      - HDFS_CONF_dfs_permissions_enabled=false # Disable permissions for dev
    ports:
      - "9870:9870" # Web UI
      - "9000:9000" # IPC
    networks:
      - streaming-net

  # HDFS Datanode (Req 2.11)
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: streaming-datanode
    environment:
      - SERVICE_PRECONDITION=namenode:9870
      - HDFS_CONF_dfs_permissions_enabled=false
    networks:
      - streaming-net

  # ==========================================
  # 2. MICROSERVICES
  # ==========================================

  # 1. Service Discovery (The Phonebook)
  discovery-service:
    build: ./backend/discovery-service
    container_name: streaming-discovery
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    networks:
      - streaming-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2. API Gateway (The Doorman) - Req 2.2
  api-gateway:
    build: ./backend/api-gateway
    container_name: streaming-gateway
    ports:
      - "8080:8080" # This is the main port you use in the browser
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_CLOUD_GATEWAY_DISCOVERY_LOCATOR_ENABLED=true
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - streaming-net

  # 3. Users Service (Req 1.1 - 1.3)
  users-service:
    build: ./backend/users-service
    container_name: streaming-users
#    ports:
#      - "8081:8081" # Exposed for debugging
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/users-db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
    depends_on:
      - mongo
      - discovery-service
    networks:
      - streaming-net

  # 4. Content Service (Req 1.4 - 1.6)
  content-service:
    build: ./backend/content-service
    container_name: streaming-content
#    ports:
#      - "8082:8082"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/content-db
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - HDFS_URI=hdfs://namenode:9000
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - mongo
      - redis
      - namenode
      - discovery-service
      - kafka
    networks:
      - streaming-net

  # 5. Ratings Service (Req 1.9)
  ratings-service:
    build: ./backend/ratings-service
    container_name: streaming-ratings
#    ports:
#      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # Scylla is compatible with Cassandra drivers
      - SPRING_CASSANDRA_CONTACT_POINTS=scylla
      - SPRING_CASSANDRA_PORT=9042
      - SPRING_CASSANDRA_LOCAL_DATACENTER=datacenter1
      - SPRING_CASSANDRA_KEYSPACE_NAME=ratings_ks
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - scylla
      - discovery-service
      - kafka
    networks:
      - streaming-net

  # 6. Subscriptions Service (Req 1.10)
  subscriptions-service:
    build: ./backend/subscriptions-service
    container_name: streaming-subscriptions
#    ports:
#      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CASSANDRA_CONTACT_POINTS=scylla
      - SPRING_CASSANDRA_PORT=9042
      - SPRING_CASSANDRA_LOCAL_DATACENTER=datacenter1
      - SPRING_CASSANDRA_KEYSPACE_NAME=subscriptions_ks
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - scylla
      - discovery-service
      - kafka
    networks:
      - streaming-net

  # 7. Notification Service (Req 1.11)
  notification-service:
    build: ./backend/notification-service
    container_name: streaming-notifications
#    ports:
#      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_CASSANDRA_CONTACT_POINTS=scylla
      - SPRING_CASSANDRA_PORT=9042
      - SPRING_CASSANDRA_LOCAL_DATACENTER=datacenter1
      - SPRING_CASSANDRA_KEYSPACE_NAME=notifications_ks
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - scylla
      - discovery-service
      - kafka
    networks:
      - streaming-net

  # 8. Recommendation Service (Req 1.13)
  recommendation-service:
    build: ./backend/recommendation-service
    container_name: streaming-recommendations
#    ports:
#      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_NEO4J_URI=bolt://neo4j:7687
      - SPRING_NEO4J_AUTHENTICATION_USERNAME=neo4j
      - SPRING_NEO4J_AUTHENTICATION_PASSWORD=password # Change if you set one
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - neo4j
      - discovery-service
      - kafka
    networks:
      - streaming-net

  # 9. Analytics Service (Req 1.16)
  analytics-service:
    build: ./backend/analytics-service
    container_name: streaming-analytics
#    ports:
#      - "8087:8087"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/analytics-db
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://discovery-service:8761/eureka/
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - mongo
      - discovery-service
      - kafka
    networks:
      - streaming-net

  # 10. Frontend (Angular)
  # This assumes you have a Dockerfile in ./frontend
#  frontend:
#    build: ./frontend
#    container_name: streaming-frontend
#    ports:
#      - "4200:80" # Maps localhost:4200 to Nginx port 80 inside
#    depends_on:
#      - api-gateway
#    networks:
#      - streaming-net

volumes:
  mongo_data:

networks:
  streaming-net:
    driver: bridge