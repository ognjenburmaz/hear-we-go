<div class="main-container">
  <div class="container-card">
    
   
      <button class="addArtist" (click)="navigateToAdd()">Dodaj Umetnika</button>
    
     <table  class="table-artists">
  <thead>
   <tr class="tr-th">
                <th>Name</th>
                <th>Biography</th>
                <th>Genres</th>
                <th>Edit</th>
            </tr>
  </thead>
  <tbody>
   
    <tr *ngFor="let artist of artists">
              <td>{{artist.name}}</td>
              <td>{{artist.biography}}</td>
              <td>{{artist.genres[0]}}</td>
              <td><button class="editArtist"  [routerLink]="['/artists/put', artist.id]">Izmeni Umetnika</button></td>
            </tr>
  </tbody>
</table>

    

  </div>
</div>
