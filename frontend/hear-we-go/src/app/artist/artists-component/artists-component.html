<div class="main-container">
  <div class="container-card">
   
    <a href="artists/add">
      <button class="btn-addArtist">Dodaj Umetnika</button>
        </a>
        <table class="table-artists">
            <tr class="tr-th">
                <th>Name</th>
                <th>Biography</th>
                <th>Genres</th>
                
            </tr>
            <tr *ngFor="let artist of artists">
              <td>{{artist.name}}</td>
              <td>{{artist.biography}}</td>
              <td>{{artist.genres[0]}}</td>
            </tr>
        </table>
  </div>
</div>
