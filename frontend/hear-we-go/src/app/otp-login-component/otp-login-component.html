<div class="login-container">
  <div class="login-card">
    <h2>Unesite vas jednokratni kod</h2>
    <p class="subtitle">Unesite kod...</p>

    <form (ngSubmit)="onLogin()">

      <div class="form-group">
        <label for="password">Lozinka</label>
        <input [(ngModel)]="otp" class="form-control" id="password" name="password" required type="password">
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button class="btn-login" type="submit">Prijavi se</button>
    </form>

    <div class="footer-links">
      <a routerLink="/register">Nemate nalog? Registracija</a>
    </div>
  </div>
</div>
