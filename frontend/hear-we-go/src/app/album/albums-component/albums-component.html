<div class="main-container">
  <div class="container-card">


    <button class="addArtist" (click)="navigateToAdd()">Dodaj Album</button>

    <table  class="table-artists">
      <thead>
        <tr class="tr-th">
          <th>Title</th>
          <th>Genre</th>
          <th>Release Date</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>

        @for (album of albums; track album) {
          <tr>
            <td>{{album.title}}</td>
            <td>{{album.genre}}</td>
            <td>{{album.releaseDate}}</td>
            <td class="actions-cell">
            <button class="editArtist"  [routerLink]="['/albums/put', album.id]">Izmeni Album</button>
            <button class="editArtist"  [routerLink]="['/albums/', album.id,'songs']">Pesme</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
