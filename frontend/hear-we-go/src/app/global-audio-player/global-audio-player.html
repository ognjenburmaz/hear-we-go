<audio id="globalAudioPlayer" style="display: none;" preload="metadata"></audio>

@if (currentSongId) {
  <div class="audio-player-container">
    <!-- Close Button -->
    <button (click)="closePlayer()" aria-label="Close player" class="close-player-btn">✕</button>

    <div class="audio-player-card">
      <div class="song-info">
        <div aria-hidden="true" class="cover-placeholder">
          <!-- ...existing code... (optional album art) -->
        </div>
        <div class="meta">
          <span class="song-title">{{ currentSongName }}</span>
          <span class="genre-tag">{{ currentSongGenre }}</span>
        </div>
      </div>

      <div class="player-controls">
        <button (click)="seek(-10)" aria-label="Rewind 10 seconds" class="icon-btn">
          <!-- rewind SVG -->
          <svg aria-hidden="true" fill="none" height="20" viewBox="0 0 24 24" width="20">
            <path d="M11 19V5l-7 7 7 7zM20 19V5l-7 7 7 7z" fill="currentColor"/>
          </svg>
        </button>

        @if (isPlaying) {
          <button (click)="togglePlay()" aria-label="Pause" class="main-play-btn playing">
            <!-- pause SVG -->
            <svg aria-hidden="true" fill="none" height="28" viewBox="0 0 24 24" width="28">
              <rect fill="currentColor" height="14" width="4" x="6" y="5"/>
              <rect fill="currentColor" height="14" width="4" x="14" y="5"/>
            </svg>
          </button>
        } @else {
          <button (click)="togglePlay()" aria-label="Play" class="main-play-btn">
            <!-- play SVG -->
            <svg aria-hidden="true" fill="none" height="28" viewBox="0 0 24 24" width="28">
              <path d="M8 5v14l11-7z" fill="currentColor"/>
            </svg>
          </button>
        }

        <button (click)="seek(10)" aria-label="Forward 10 seconds" class="icon-btn">
          <!-- forward SVG -->
          <svg aria-hidden="true" fill="none" height="20" viewBox="0 0 24 24" width="20">
            <path d="M13 5v14l7-7-7-7zM4 5v14l7-7-7-7z" fill="currentColor"/>
          </svg>
        </button>
      </div>

      <div class="timeline-box">
        <span class="time-text">{{ currentTime | date:'m:ss' }}</span>

        <div class="slider-wrap">
          <input
            (input)="onSeek($event)"
            [max]="duration || 0"
            [value]="currentSeconds"
            aria-label="Seek"
            class="modern-slider"
            type="range"
          />
          <div aria-hidden="true" class="slider-fill"
               style="width: calc(({{currentSeconds}} / ({{duration || 1}})) * 100%);"></div>
        </div>

        <span class="time-text">{{ formatSecondsToDate(duration) | date:'m:ss' }}</span>
      </div>
    </div>
  </div>
}
