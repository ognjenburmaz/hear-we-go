<div class="page-wrapper">

  @if (album) {
    <div class="album-hero">
      <div class="album-meta">
        <span class="genre-pill">{{ album.genre }}</span>
        <h1 class="album-title">{{ album.title }}</h1>
        <p class="album-sub">Released on {{ album.releaseDate | date:'longDate' }}</p>
      </div>
    </div>
  }

  <div class="tracklist-section">
    <h2 class="section-title">Tracks</h2>
    <div class="song-list">
      @for (song of songs; track song; let i = $index) {
        <div class="song-item">
          <span class="track-index">{{ i + 1 }}</span>
          <div class="song-main">
            <span class="song-name">{{ song.title }}</span>
            <span class="song-genre-tag">{{ song.genre }}</span>
          </div>
          <button (click)="setCurrentlyPlayingSong(song.title, song.id)">Pusti</button>
          <span class="song-time">{{ formatDuration(song.durationSeconds) }}</span>
          <!--          <audio id="audioPlayer{{ song.id }}" controls src="https://localhost/api/content/songs/{{ song.id }}/audio"></audio>-->
          <audio controls id="audioPlayer{{ song.id }}"></audio>

        </div>
      }
    </div>
  </div>
</div>
