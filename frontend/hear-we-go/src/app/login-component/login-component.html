<div class="login-container">
  <div class="login-card">
    <h2>Dobrodošli</h2>
    <p class="subtitle">Prijavite se na sistem</p>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="username">Korisničko ime</label>
        <input type="text" id="username" name="username" [(ngModel)]="username" class="form-control" required>
      </div>

      <div class="form-group">
        <label for="password">Lozinka</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" class="form-control" required>
      </div>

      @if (errorMessage) {
        <div class="error-message">
          {{ errorMessage }}
        </div>
        @if (errorMessage == 'Vreme vazenja vase lozinke je isteklo, promenite je klikom na dugme ispod:') {
          <br>
          <a routerLink="/recovery">Resetuj lozinku</a>
        }
      }

      <button type="submit" class="btn-login">Prijavi se</button>
    </form>

    <div class="footer-links">
      <a routerLink="/register">Nemate nalog? Registracija</a>
      <br>
      <br>
      <a routerLink="/recovery">Zaboravili ste sifru?</a>
    </div>
  </div>
</div>
