apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: scylla-pvc
  namespace: hear-we-go
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-scylla
  namespace: hear-we-go
spec:
  selector:
    matchLabels:
      app: streaming-scylla
  template:
    metadata:
      labels:
        app: streaming-scylla
    spec:
      containers:
      - name: streaming-scylla
        image: scylladb/scylla
        args: ["--smp", "1", "--memory", "750M"]
        ports:
        - containerPort: 9042
        volumeMounts:
        - name: scylla-data
          mountPath: /var/lib/scylla
      volumes:
      - name: scylla-data
        persistentVolumeClaim:
          claimName: scylla-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: streaming-scylla
  namespace: hear-we-go
spec:
  selector:
    app: streaming-scylla
  ports:
  - port: 9042
    targetPort: 9042