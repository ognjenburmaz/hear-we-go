apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-mailhog
  namespace: hear-we-go
spec:
  selector: { matchLabels: { app: streaming-mailhog } }
  template:
    metadata: { labels: { app: streaming-mailhog } }
    spec:
      containers:
        - name: streaming-mailhog
          image: mailhog/mailhog:latest
          ports:
            - containerPort: 8025
            - containerPort: 1025
---
apiVersion: v1
kind: Service
metadata:
  name: streaming-mailhog
  namespace: hear-we-go
spec:
  selector: { app: streaming-mailhog }
  ports:
    - name: ui
      port: 8025
      targetPort: 8025
    - name: smtp
      port: 1025
      targetPort: 1025