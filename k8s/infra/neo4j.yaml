apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-pvc
  namespace: hear-we-go
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-neo4j
  namespace: hear-we-go
spec:
  selector:
    matchLabels:
      app: streaming-neo4j
  template:
    metadata:
      labels:
        app: streaming-neo4j
    spec:
      containers:
      - name: streaming-neo4j
        image: neo4j:5
        command: ["/bin/bash", "/var/lib/neo4j/import/init.sh"]
        env:
        - name: NEO4J_AUTH
          value: "none"
        - name: NEO4J_ACCEPT_LICENSE_AGREEMENT
          value: "yes"
        ports:
        - containerPort: 7474
        - containerPort: 7687
        volumeMounts:
        - name: neo4j-data
          mountPath: /data
        - name: neo4j-init-config
          mountPath: /var/lib/neo4j/import
      volumes:
      - name: neo4j-data
        persistentVolumeClaim:
          claimName: neo4j-pvc
      - name: neo4j-init-config
        configMap:
          name: neo4j-init-config
---
apiVersion: v1
kind: Service
metadata:
  name: streaming-neo4j
  namespace: hear-we-go
spec:
  selector:
    app: streaming-neo4j
  ports:
  - name: http
    port: 7474
    targetPort: 7474
  - name: bolt
    port: 7687
    targetPort: 7687