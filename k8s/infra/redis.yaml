apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-redis
  namespace: hear-we-go
spec:
  selector:
    matchLabels:
      app: streaming-redis
  template:
    metadata:
      labels:
        app: streaming-redis
    spec:
      containers:
        - name: streaming-redis
          image: redis:alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: streaming-redis
  namespace: hear-we-go
spec:
  selector:
    app: streaming-redis
  ports:
    - port: 6379
      targetPort: 6379