apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscriptions-service
  namespace: hear-we-go
spec:
  replicas: 1
  selector: { matchLabels: { app: subscriptions-service } }
  template:
    metadata: { labels: { app: subscriptions-service } }
    spec:
      containers:
        - name: subscriptions-service
          image: hear-we-go-subscriptions-service:latest # CHECK THIS NAME
          imagePullPolicy: Never
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://streaming-jaeger:4318"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "streaming-kafka:9092"
            - name: SPRING_CASSANDRA_CONTACT_POINTS
              value: "streaming-scylla"
            - name: SPRING_CASSANDRA_PORT
              value: "9042"
            - name: SPRING_CASSANDRA_KEYSPACE_NAME
              value: "subscriptions_ks"  # <--- Different value here!
            - name: SPRING_CASSANDRA_LOCAL_DATACENTER
              value: "datacenter1"
            - name: LOGGING_CONFIG
              value: /config/logback-spring.xml
#          ports:
#            - containerPort: 8080
          volumeMounts:
            - name: certs-volume
              mountPath: /app/certs
              readOnly: true
            - name: logback-config
              mountPath: /config
              readOnly: true
      volumes:
        - name: certs-volume
          secret: { secretName: cert-secret }
        - name: logback-config
          configMap:
            name: logback-config
---
apiVersion: v1
kind: Service
metadata:
  name: subscriptions-service
  namespace: hear-we-go
spec:
  selector: { app: subscriptions-service }
  type: ClusterIP # Exposes Gateway externally just in case
  ports:
    - name: "https"
      port: 8087
      targetPort: 8087