apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  namespace: hear-we-go
spec:
  replicas: 1
  selector: { matchLabels: { app: analytics-service } }
  template:
    metadata: { labels: { app: analytics-service } }
    spec:
      containers:
        - name: analytics-service
          image: hear-we-go-analytics-service:latest # CHECK THIS NAME
          imagePullPolicy: Never
          envFrom:
            - configMapRef: { name: app-config }
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://streaming-jaeger:4318"
            - name: SPRING_DATA_MONGODB_URI
              value: "mongodb://streaming-mongo:27017/analytics-db"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
#          ports:
#            - containerPort: 8080
          volumeMounts:
            - name: certs-volume
              mountPath: /app/certs
              readOnly: true
      volumes:
        - name: certs-volume
          secret: { secretName: cert-secret }
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  namespace: hear-we-go
spec:
  selector: { app: analytics-service }
  ports:
    - name: "https"
      port: 8083
      targetPort: 8083
#    - name: "http"
#      port: 8083
#      targetPort: 8083